# NEW trial template; replace example.test and certificate paths before installation.
# Include inside nginx http{}. Loopback upstreams are deliberately not public APIs.
server {
 listen 80;
 server_name example.test;
 location /.well-known/acme-challenge/ { root /var/www/dangkou-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name example.test;
 ssl_certificate /etc/letsencrypt/live/example.test/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/example.test/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/dangkou-error.log crit;
 client_max_body_size 21m;
 add_header Referrer-Policy no-referrer always;
 add_header X-Content-Type-Options nosniff always;
 location = /tool { return 301 /tool/; }
 # Static uni-app build (base /tool/) must be copied to this release path.
 location /tool/assets/ { alias /home/ubuntu/dangkou-wechat-test/frontend/dist/build/h5/assets/; }
 location = /tool/ { alias /home/ubuntu/dangkou-wechat-test/frontend/dist/build/h5/index.html; }
 # Strip /tool for central API; this port must equal USER_APP_PORT and
 # the private CUSTOMER_IDENTITY_BASE_URL port used by the shop API.
 location /tool/ {
   proxy_pass http://127.0.0.1:19100/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 180s;
 }
 # Dynamic chat links use /merchant/customer/<id>/cs/... through the hub below.
 # Keep /cs unchanged. Only customer routes are public here.
 location /cs/ {
   proxy_pass http://127.0.0.1:19010;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 180s;
 }
 # Merchant gateway enforces its own authorization; API management is not exposed.
 location / {
   proxy_pass http://127.0.0.1:8890;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 180s;
 }
 # Model bridge :4000 is private and has no public proxy route.
}
