server {
 listen 127.0.0.1:8080;
 server_name 134.175.135.102;
 access_log off;
 location /.well-known/acme-challenge/ { root /var/www/dangkou-acme; }
 location / { return 301 https://$host:80$request_uri; }
}
server {
 listen 443 ssl;
 server_name 134.175.135.102;
 ssl_certificate /etc/letsencrypt/live/134.175.135.102/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/134.175.135.102/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/dangkou-error.log crit;
 client_max_body_size 12m;
 add_header Referrer-Policy no-referrer always;
 add_header X-Content-Type-Options nosniff always;
 location / {
   proxy_pass http://127.0.0.1:8890;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_read_timeout 180s;
 }
}
