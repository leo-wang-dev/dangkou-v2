<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="shopProducts" data-icon="">本店商品</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,'PingFang SC',sans-serif}main{max-width:1180px;margin:auto;padding:16px}header{background:white;border-bottom:1px solid #ececec;padding:18px}header>div{max-width:1148px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#666;line-height:1.6}button,a.action{cursor:pointer;border:1px solid #ddd;border-radius:9px;background:#fff;padding:9px 14px;font-size:14px;color:#1652f0;text-decoration:none}input{width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;font-size:16px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.on{background:#1652f0!important;color:white!important;border-color:#1652f0!important}#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:16px;min-width:0}.photo{display:block;width:100%;height:220px;object-fit:contain;background:#f8f9fb;border:0;border-radius:10px;cursor:zoom-in}.placeholder{height:220px;display:flex;align-items:center;justify-content:center;background:#f8f9fb;color:#888;border-radius:10px}h2{font-size:18px;overflow-wrap:anywhere}.category{font-size:13px;color:#888}details{margin:16px 0}summary{cursor:pointer;color:#1652f0}dl{font-size:14px}dt{color:#888;margin-top:12px}dd{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:40px 16px;text-align:center;background:#fff;border-radius:12px}.hint{font-size:13px}dialog{border:0;border-radius:12px;max-width:96vw;padding:12px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:88vw;max-height:75vh;object-fit:contain}dialog button{display:block;margin:10px 0 0 auto}#count{font-size:14px;color:#666}
</style><style>.customer-language{display:flex;gap:10px;align-items:center;padding:8px 16px;background:#fff}.customer-language select{max-width:180px}html[dir=rtl] body{text-align:right}html[dir=rtl] th,html[dir=rtl] td{text-align:start}td[contenteditable],.msg,.f{unicode-bidi:plaintext}html[dir=rtl] .msg.me{align-self:flex-start}html[dir=rtl] .msg.bot{align-self:flex-end}</style></head><body><header><div><h1 id="shop" data-i18n="shopProducts" data-icon="">本店商品</h1><p data-i18n="productsIntro" data-icon="">查看商品图片与规格，记下型号后回到客服页继续咨询。</p><a id="bot" class="action" hidden data-i18n="backToChat" data-icon="">返回客服页</a></div></header><main><input id="search" aria-label="搜索商品" placeholder="搜索型号、颜色、规格…" data-i18n-placeholder="productSearchHint"><div id="categories" class="bar"></div><div class="bar"><span id="count"></span><button id="refresh" data-i18n="refreshProducts" data-icon="">刷新商品</button></div><div id="products" aria-live="polite"></div></main><dialog id="viewer"><img alt="商品大图"><button id="close" data-i18n="closeLargeImage" data-icon="">关闭大图</button></dialog>
<script src="../customer-catalog.js"></script>
<script src="../customer-sources.js"></script>
<script src="../customer-i18n.js"></script>
<script>
const {t,label,display,request:customerFetch}=CustomerI18n;

const prefix=location.pathname.slice(0,location.pathname.lastIndexOf('/cs/'));
const $=s=>document.querySelector(s);let products=[],category='',botUrl='';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){const q=$('#search').value.trim().toLowerCase();const rows=products.filter(p=>(!category||p._category===category)&&JSON.stringify([p.name,p.specs]).toLowerCase().includes(q));$('#count').textContent=t('productCount',{count:rows.length});const list=$('#products');list.replaceChildren();if(!rows.length){list.append(el('div',products.length?t('noMatchingProducts'):t('noOnlineProducts'),'empty'));return;}
for(const p of rows){const card=el('article',undefined,'card');if(p.photo){const img=el('img');img.className='photo';img.alt=t('productImage',{product:p.name});img.loading='lazy';img.src=prefix+p.photo;const open=el('button');open.className='photo';open.style.padding='0';open.setAttribute('aria-label',t('zoomProductImage',{product:p.name}));open.append(img);open.onclick=()=>{$('#viewer img').src=img.src;$('#viewer img').alt=img.alt;$('#viewer').showModal();};img.onerror=()=>open.replaceWith(el('div',t('imageUnavailable'),'placeholder'));card.append(open);}else card.append(el('div',t('noProductImage'),'placeholder'));card.append(el('h2',p.name),el('div',p.category_name,'category'));const detail=el('details');detail.append(el('summary',t('viewSpecs')));const dl=el('dl');for(const [k,v]of Object.entries(p.specs)){dl.append(el('dt',label(k)),el('dd',v));}detail.append(dl);card.append(detail);if(botUrl){const a=el('a',t('botChat'),'action');a.href=botUrl;card.append(a);}card.append(el('p',t('sendModelHint',{product:p.name}),'hint'));list.append(card);}}
async function load(){$('#refresh').disabled=true;$('#products').replaceChildren(el('div',t('loadingProducts'),'empty'));try{const r=await customerFetch(prefix+'/cs/showcase',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();products=data.products;botUrl=/^https:\/\/t\.me\/[A-Za-z0-9_]+$/.test(data.bot_url)?data.bot_url:'';$('#shop').textContent=data.shop_name;document.title=data.shop_name+' · '+t('products');$('#bot').hidden=!botUrl;$('#bot').href=botUrl;const cats=[['',t('allCategories')],...new Map(products.map(p=>[p._category,p.category_name])).entries()];if(!cats.some(([k])=>k===category))category='';$('#categories').replaceChildren();for(const [key,name]of cats){const b=el('button',name,key===category?'on':'');b.onclick=()=>{category=key;for(const n of $('#categories').children)n.classList.remove('on');b.classList.add('on');render();};$('#categories').append(b);}render();}catch(e){$('#count').textContent='';$('#products').replaceChildren(el('div',t('productsLoadError'),'empty'));}finally{$('#refresh').disabled=false;}}
CustomerI18n.mount();$('#search').oninput=render;$('#refresh').onclick=load;$('#close').onclick=()=>$('#viewer').close();load();
</script></body></html>
