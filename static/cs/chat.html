<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>采购助手</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;background:#f5f6f8;color:#222;display:flex;flex-direction:column;height:100vh}
  header{background:#1677ff;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
  header b{flex:1;font-size:16px}
  header button{border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bot{background:#fff;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .me{background:#1677ff;color:#fff;align-self:flex-end}
  .msg a{color:#1677ff}
  .msg img{max-width:100%;border-radius:8px;margin-top:6px}
  form{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
  input[type=text]{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:15px;outline:none}
  form button{border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;background:#1677ff;color:#fff}
  #cam,#boss{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #boss{border-radius:20px;width:auto;padding:0 12px;font-size:13px}
  #tip{pointer-events:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9}
  .langbar{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;font-size:13px}
  .langbar button{border:1px solid #ddd;background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer}
  .langbar button.on{background:#1677ff;color:#fff;border-color:#1677ff}
  #drawer{position:fixed;inset:0;z-index:20}
  #drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  #drawer aside{position:absolute;left:0;right:0;top:12%;bottom:0;background:#f5f6f8;
                border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
  .dhead b{flex:1;font-size:15px}
  .dhead button{border:0;background:#1677ff;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  .dhead button.ghost{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #dempty{margin:24px 16px;padding:32px 16px;text-align:center;color:#999;background:#fff;border-radius:8px}
  #listframe{flex:1;border:0;width:100%}
  .session-controls,#batches{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;font-size:13px}
  .session-controls button,#batches button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:#245b9c}
  #batches{max-height:160px;overflow:auto;flex-shrink:0}#batches:empty{display:none}#batches label{width:100%}
</style>
</head>
<body>
<header><b>🤖 采购助手</b><button id="mylist" onclick="openList()">📋 我的清单</button><button id="cam" onclick="document.getElementById('file').click()">📷</button><button id="boss" onclick="send('找老板')">找老板</button></header>
<div class="langbar" id="langbar" hidden>
  <span style="align-self:center;color:#888">语言 / Language:</span>
  <button onclick="pickLang('中文')">中文</button><button onclick="pickLang('English')">English</button>
</div>
<div class="session-controls"><span id="photo-mode">图片模式：待选择</span><button onclick="setMode('search')">查商品</button><button onclick="setMode('notes')">记笔记</button><button onclick="newSession(true)">结束当前会话</button><button onclick="manualBatch()">手动切换档口</button></div><div id="batches"></div><div id="log"></div>
<form onsubmit="event.preventDefault();send()">
  <input id="text" type="text" placeholder="发消息，或点 📷 拍照整理采购清单" autocomplete="off">
  <button type="submit">➤</button>
</form>
<input id="file" type="file" accept="image/*" capture="environment" hidden onchange="photo(this)">
<div id="tip"></div>
<div id="drawer" hidden>
  <div class="mask" onclick="closeList()"></div>
  <aside>
    <div class="dhead"><b>📋 我的清单</b><button class="ghost" onclick="openList()">↻ 刷新</button><button onclick="closeList()">✕ 关闭</button></div>
    <div id="dempty" hidden>还没有清单——在对话里发照片整理条目，然后说「出表」生成清单。</div>
    <iframe id="listframe" title="我的采购清单"></iframe>
  </aside>
</div>
<script>
const TOKEN = location.pathname.split('/').pop();
let visitor = sessionStorage.getItem('h5v:'+TOKEN) || '';
let photoMode = '';
let ready;
const log = document.getElementById('log');
function bubble(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  d.textContent = text;
  // 链接可点（出表回复里的清单链接）
  if (role !== 'me') { d.innerHTML = d.innerHTML.replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function tip(t){ const el=document.getElementById('tip'); el.textContent=t; el.style.opacity=1; setTimeout(()=>el.style.opacity=0, 1800); }
async function send(override){
  await ready;
  const box = document.getElementById('text');
  const text = override || box.value.trim();
  if (!text) return;
  if (!override) box.value = '';
  bubble('me', text);
  try{
    const r = await fetch(`/cs/chat/${TOKEN}/message`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, visitor})});
    const d = await r.json();
    bubble('bot', d.reply || d.detail || '…');
    await refreshSession();
  }catch(e){ tip('网络异常，请重试'); }
}
async function photo(input){
  await ready;
  const f = input.files[0]; input.value = '';
  if (!f) return;
  bubble('me', '📷 ' + (f.name || '照片'));
  tip('识别中…');
  const fd = new FormData(); fd.append('file', f); fd.append('visitor', visitor);
  try{
    const r = await fetch(`/cs/chat/${TOKEN}/photo`, {method:'POST', body: fd});
    const d = await r.json();
    bubble('bot', d.reply || d.detail || '…');
    await refreshSession();
  }catch(e){ tip('上传失败，请重试'); }
}
async function pickLang(lang){
  await ready;
  await fetch(`/cs/chat/${TOKEN}/lang`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lang, visitor})});
  document.getElementById('langbar').hidden = true;
  bubble('bot', lang === '中文' ? '您好！可以查询商品、发照片整理采购清单，需要联系商家可点右上角「找老板」。'
    : 'Hello! You can search products or send photos to build a purchase list. Tap "找老板" to reach the owner.');
}
// 我的清单抽屉：后端按访客取最近 cs_link token，iframe 复用 list.html 的表格/编辑/导出能力
async function openList(){
  await ready;
  const drawer = document.getElementById('drawer');
  drawer.hidden = false;
  document.getElementById('dempty').hidden = true;
  const frame = document.getElementById('listframe');
  frame.src = 'about:blank';
  try{
    const r = await fetch(`/cs/chat/${TOKEN}/list-token?visitor=${encodeURIComponent(visitor)}`);
    const d = await r.json();
    if (d.token){
      frame.src = `/cs/list.html?k=${encodeURIComponent(d.token)}`;
    } else {
      document.getElementById('dempty').hidden = false;
    }
  }catch(e){ tip('网络异常，请重试'); }
}
function closeList(){ document.getElementById('drawer').hidden = true; }
async function newSession(end=false){
  if(end&&visitor){const r=await fetch(`/cs/chat/${TOKEN}/session/end`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor})});if(!r.ok&&r.status!==410){tip('结束会话失败');return;}}
  const r=await fetch(`/cs/chat/${TOKEN}/session`,{method:'POST'}); const d=await r.json();
  visitor=d.visitor;sessionStorage.setItem('h5v:'+TOKEN,visitor);log.replaceChildren();closeList();await refreshSession();
}
async function refreshSession(){
  const r=await fetch(`/cs/chat/${TOKEN}/session?visitor=${encodeURIComponent(visitor)}`);
  if(r.status===410||r.status===401){tip('会话已失效，请开始新会话');return;}
  if(!r.ok)return;const d=await r.json(); photoMode=d.photo_mode;
  document.getElementById('photo-mode').textContent='图片模式：'+({search:'查商品',notes:'记笔记'}[photoMode]||'待选择');
  const el=document.getElementById('batches');el.replaceChildren();
  for(const n of d.notes||[]){if(n.batch_state!=='unassigned'&&n.batch_state!=='legacy_unassigned')continue;
    const label=document.createElement('label'), check=document.createElement('input');check.type='checkbox';check.value=n.id;
    label.append(check,document.createTextNode('关联待归属条目 '+n.id+' '+(n.fields['型号或品名']||'')));el.append(label);
  }
  for(const b of d.batches||[]){if(b.state==='unassigned')continue;
    const btn=document.createElement('button');btn.textContent=(b.active?'当前档口：':'确认切换：')+(b.fields['档口名称']||'未命名档口');btn.onclick=()=>confirmBatch(b.id);el.append(btn);}
}
async function setMode(mode){await ready;const r=await fetch(`/cs/chat/${TOKEN}/mode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor,mode})});const d=await r.json();if(d.reply||d.detail)bubble('bot',d.reply||d.detail);await refreshSession();}
async function confirmBatch(batch_id,fields=null){
  const note_ids=Array.from(document.querySelectorAll('#batches input:checked'),x=>Number(x.value));
  const r=await fetch(`/cs/chat/${TOKEN}/batches/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor,batch_id,note_ids,fields})});
  if(!r.ok){tip((await r.json()).detail||'切换失败');return;}await refreshSession();
}
async function manualBatch(){const name=prompt('新档口名称（仅用于后续照片和勾选的待归属条目）');if(name)await confirmBatch(null,{'档口名称':name});}
ready=(async function init(){
  if(!visitor)await newSession();else await refreshSession();

  // 首访先选语言；老访客直接欢迎
  const first = !sessionStorage.getItem('h5lang');
  if (first) { document.getElementById('langbar').hidden = false; }
  else bubble('bot', '您好，有什么可以帮您？');
})();
</script>
</body>
</html>
