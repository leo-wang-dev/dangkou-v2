<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="chatTitle" data-icon="">采购助手</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;background:#f5f6f8;color:#222;display:flex;flex-direction:column;height:var(--customer-viewport-height,100dvh);overflow:hidden}
  header{background:#1677ff;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
  header b{flex:1;font-size:16px}
  header button{border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  #who{font-size:12px;opacity:.9;max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #loginbar{background:#fff;border-bottom:1px solid #eee;padding:10px 12px;display:none;flex-direction:column;gap:8px}
  #loginbar .row{display:flex;gap:8px}#loginbar input{flex:1;min-width:0;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:15px}
  #loginbar button{border:0;border-radius:8px;padding:9px 12px;background:#1677ff;color:#fff}#loginbar button:disabled{background:#9ec4ff}
  #log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  #history-more{align-self:center;margin:6px;padding:6px 14px;border:1px solid #d5e6ff;border-radius:16px;background:#fff;color:#1677ff}
  .msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bot{background:#fff;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .me{background:#1677ff;color:#fff;align-self:flex-end}
  .msg a{color:#1677ff}
  .msg img{max-width:100%;border-radius:8px;margin-top:6px}
  form{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #eee;flex-shrink:0}
  input[type=text]{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:15px;outline:none}
  form button{border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;background:#1677ff;color:#fff}
  #cam,#boss{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #boss{border-radius:20px;width:auto;padding:0 12px;font-size:13px}
  #tip{pointer-events:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9}
  .langbar{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;font-size:13px}
  .langbar button{border:1px solid #ddd;background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer}
  .langbar button.on{background:#1677ff;color:#fff;border-color:#1677ff}
  #drawer{position:fixed;inset:0 0 auto;height:var(--customer-viewport-height,100dvh);z-index:20}
  #drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  #drawer aside{position:absolute;left:0;right:0;top:12%;bottom:0;background:#f5f6f8;
                border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
  .dhead b{flex:1;font-size:15px}
  .dhead button{border:0;background:#1677ff;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  .dhead button.ghost{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #dempty{margin:24px 16px;padding:32px 16px;text-align:center;color:#999;background:#fff;border-radius:8px}
  #listframe{flex:1;border:0;width:100%}
  .session-controls,#batches{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;font-size:13px}
  .session-controls button,#batches button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:#245b9c}
  #batches{max-height:160px;overflow:auto;flex-shrink:0}#batches:empty{display:none}#pending-photo[hidden]{display:none}#batches label{width:100%}
  body.compact-viewport .session-controls,body.compact-viewport #batches,body.compact-viewport .customer-language{display:none}
</style>
<style>.customer-language{display:flex;gap:10px;align-items:center;padding:8px 16px;background:#fff}.customer-language select{max-width:180px}html[dir=rtl] body{text-align:right}html[dir=rtl] th,html[dir=rtl] td{text-align:start}td[contenteditable],.msg,.f{unicode-bidi:plaintext}html[dir=rtl] .msg.me{align-self:flex-start}html[dir=rtl] .msg.bot{align-self:flex-end}</style></head>
<body>
<header><b data-i18n="chatTitle" data-icon="🤖 ">🤖 采购助手</b><span id="who"></span><button id="loginbtn" onclick="toggleLogin()" data-i18n="login" data-icon="">登录</button><button id="mylist" onclick="openList()" data-i18n="myShortList" data-icon="📋 ">📋 我的清单</button><button id="cam" onclick="document.getElementById('file').click()">📷</button><button id="boss" onclick="sendAction('contact_owner')" data-i18n="contactOwner" data-icon="">找老板</button></header>
<div id="loginbar"><div class="row"><input id="email" type="email" data-i18n-placeholder="email" placeholder="邮箱" autocomplete="email"><button id="sendbtn" onclick="sendCode()" data-i18n="sendCodeShort">发验证码</button></div><div class="row"><input id="code" type="text" data-i18n-placeholder="verificationCode" placeholder="6位验证码" autocomplete="one-time-code" inputmode="numeric"><button id="verifybtn" onclick="doLogin()" data-i18n="login">登录</button></div><small data-i18n="loginHint">登录后清单会挂到您的账号；未登录也可直接用。</small></div>
<div id="claimretry" class="session-controls" style="display:none"><button onclick="retryClaim()" data-i18n="refresh">重试合并记录</button><span data-i18n="networkError">网络错误，请重试</span></div>
<div id="langbar" hidden></div>
<div class="session-controls"><span id="photo-mode">图片模式：待选择</span><button onclick="setMode('search')" data-i18n="findProduct" data-icon="">查商品</button><button onclick="setMode('notes')" data-i18n="takeNotes" data-icon="">记笔记</button><button onclick="newSession(true)" data-i18n="endSession" data-icon="">结束当前会话</button><button onclick="manualBatch()" data-i18n="manualSwitchShop" data-icon="">手动切换档口</button></div><div id="pending-photo" class="session-controls" hidden><span data-i18n="pendingPhoto" data-icon="">有一张照片待处理。请选择模式后重试，或明确放弃。</span><button onclick="retryPhoto()" data-i18n="retryPhoto" data-icon="">重试待处理照片</button><button onclick="discardPhoto()" data-i18n="discardPhoto" data-icon="">放弃待处理照片</button></div><div id="batches"></div><button id="history-more" hidden onclick="loadOlderHistory()" data-i18n="loadOlderMessages">加载更早消息</button><div id="log"></div>
<form onsubmit="event.preventDefault();send()">
  <input id="text" type="text" placeholder="发消息，或点 📷 拍照整理采购清单" data-i18n-placeholder="chatInputHint" autocomplete="off">
  <button type="submit">➤</button>
</form>
<input id="file" type="file" accept="image/*" capture="environment" hidden onchange="photo(this)">
<div id="tip"></div>
<div id="drawer" hidden>
  <div class="mask" onclick="closeList()"></div>
  <aside>
    <div class="dhead"><b data-i18n="myShortList" data-icon="📋 ">📋 我的清单</b><button class="ghost" onclick="openList()" data-i18n="refresh" data-icon="↻ ">↻ 刷新</button><button onclick="closeList()" data-i18n="close" data-icon="✕ ">✕ 关闭</button></div>
    <div id="dempty" hidden data-i18n="chatListEmpty" data-icon="">还没有清单——在对话里发照片整理条目，然后说「出表」生成清单。</div>
    <iframe id="listframe" title="我的采购清单"></iframe>
  </aside>
</div>
<script src="../../customer-catalog.js"></script>
<script src="../../customer-sources.js"></script>
<script src="../../customer-i18n.js"></script>
<script>
const {t,label,display}=CustomerI18n;
const CUSTOMER_PREFIX = location.pathname.match(/^\/merchant\/customer\/[a-f0-9]{24}(?=\/)/)?.[0] || '';
const customerFetch = (path, options={}) => CustomerI18n.request(CUSTOMER_PREFIX + path,
  {...options,headers:{...options.headers,...(AUTH_TOKEN?{'Authorization':'Bearer '+AUTH_TOKEN}:{})}});
const centralFetch = (path, options={}) => CustomerI18n.request('/tool/'+path,options);

const TOKEN = location.pathname.split('/').pop();
const VISITOR_KEY = 'h5v:' + (CUSTOMER_PREFIX ? CUSTOMER_PREFIX + ':' : '') + TOKEN;
let visitor = sessionStorage.getItem(VISITOR_KEY) || '';
let AUTH_TOKEN = localStorage.getItem('ut_token') || '';
let AUTH_EMAIL = localStorage.getItem('ut_email') || '';
let photoMode = '';
let hasPending = false;
let historyBefore = 0;
let ready;
const log = document.getElementById('log');
function fitViewport(){
  if(typeof window==='undefined')return;
  const height=window.visualViewport?.height||window.innerHeight;
  if(height>=100)document.documentElement.style.setProperty('--customer-viewport-height',height+'px');
  document.body?.classList?.toggle('compact-viewport',height<400);
}
fitViewport();
if(typeof window!=='undefined'){
  window.visualViewport?.addEventListener('resize',fitViewport);
  window.visualViewport?.addEventListener('scroll',fitViewport);
  window.addEventListener('resize',fitViewport);
}
function messageElement(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  d.textContent = text;
  // 链接可点（出表回复里的清单链接）
  if (role !== 'me') { d.innerHTML = d.innerHTML.replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  return d;
}
function bubble(role, text){
  log.appendChild(messageElement(role,text)); log.scrollTop = log.scrollHeight;
}
function tip(t){ const el=document.getElementById('tip'); el.textContent=t; el.style.opacity=1; setTimeout(()=>el.style.opacity=0, 1800); }
function renderWho(){
  document.getElementById('who').textContent=AUTH_TOKEN?AUTH_EMAIL:t('guestMode');
  document.getElementById('loginbtn').textContent=AUTH_TOKEN?t('logoutShort'):t('login');
  document.getElementById('loginbar').style.display='none';
}
async function toggleLogin(){
  if(AUTH_TOKEN){
    const r=await centralFetch('session/end',{method:'POST',headers:{'Authorization':'Bearer '+AUTH_TOKEN,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok){tip(t('networkError'));return;}
    AUTH_TOKEN='';AUTH_EMAIL='';localStorage.removeItem('ut_token');localStorage.removeItem('ut_email');
    document.getElementById('claimretry').style.display='none';
    if(visitor){await refreshSession();await loadHistory();}else await newSession();
    renderWho();return;
  }
  const bar=document.getElementById('loginbar');bar.style.display=bar.style.display==='flex'?'none':'flex';
}
async function sendCode(){
  const email=document.getElementById('email').value.trim();if(!email){tip(t('enterEmail'));return;}
  const button=document.getElementById('sendbtn');button.disabled=true;
  try{const r=await centralFetch('auth/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));tip(r.ok?t('codeSent'):(d.detail||t('sendError')));
  }catch(e){tip(t('networkError'));}finally{button.disabled=false;}
}
async function claimCurrentGuest(){
  if(!AUTH_TOKEN||!visitor)return true;
  const r=await customerFetch(`/cs/chat/${TOKEN}/session/claim`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor})});
  if(!r.ok){const d=await r.json().catch(()=>({}));document.getElementById('claimretry').style.display='flex';tip(d.detail||t('networkError'));return false;}
  visitor='';sessionStorage.removeItem(VISITOR_KEY);document.getElementById('claimretry').style.display='none';return true;
}
async function retryClaim(){if(await claimCurrentGuest()){await refreshSession();await loadHistory();}}
async function loadHistory(){
  const r=await customerFetch(`/cs/chat/${TOKEN}/history${AUTH_TOKEN?'':'?visitor='+encodeURIComponent(visitor)}`);
  if(!r.ok)return;const d=await r.json();log.replaceChildren();
  for(const m of d.messages||[])bubble(m.role==='user'?'me':'bot',m.content||'');
  historyBefore=d.next_before||0;document.getElementById('history-more').hidden=!historyBefore;
}
async function loadOlderHistory(){
  if(!historyBefore)return;
  const query=new URLSearchParams({before:String(historyBefore)});
  if(!AUTH_TOKEN)query.set('visitor',visitor);
  const r=await customerFetch(`/cs/chat/${TOKEN}/history?${query}`);
  if(!r.ok){tip(t('loadError'));return;}
  const d=await r.json(), height=log.scrollHeight;
  for(const m of [...(d.messages||[])].reverse())log.prepend(messageElement(m.role==='user'?'me':'bot',m.content||''));
  historyBefore=d.next_before||0;document.getElementById('history-more').hidden=!historyBefore;
  log.scrollTop+=log.scrollHeight-height;
}
async function doLogin(){
  const email=document.getElementById('email').value.trim(),code=document.getElementById('code').value.trim();
  if(!email||!code){tip(t('enterEmailCode'));return;}
  const button=document.getElementById('verifybtn');button.disabled=true;
  try{
    const r=await centralFetch('auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,code,guest:sessionStorage.getItem('ut_guest')||''})});
    const d=await r.json().catch(()=>({}));if(!r.ok){tip(d.detail||t('loginError'));return;}
    AUTH_TOKEN=d.token;AUTH_EMAIL=d.email;localStorage.setItem('ut_token',AUTH_TOKEN);localStorage.setItem('ut_email',AUTH_EMAIL);
    sessionStorage.removeItem('ut_guest');
    if(!await claimCurrentGuest())return;
    renderWho();await refreshSession();await loadHistory();tip(t('loginMergedDetailed',{email:AUTH_EMAIL}));
  }catch(e){tip(t('networkError'));}finally{button.disabled=false;}
}
async function send(override){
  await ready;
  const box = document.getElementById('text');
  const text = override || box.value.trim();
  if (!text) return;
  if (!override) box.value = '';
  bubble('me', text);
  try{
    const r = await customerFetch(`/cs/chat/${TOKEN}/message`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, visitor})});
    const d = await r.json();
    bubble('bot', d.reply || d.detail || '…');
    await refreshSession();
  }catch(e){ tip(t('networkError')); }
}
async function photo(input){
  await ready;
  const f = input.files[0]; input.value = '';
  if (!f) return;
  bubble('me', '📷 ' + (f.name || t('photo')));
  tip(t('recognizing'));
  const fd = new FormData(); fd.append('file', f); fd.append('visitor', visitor);
  try{
    const r = await customerFetch(`/cs/chat/${TOKEN}/photo`, {method:'POST', body: fd});
    const d = await r.json();
    bubble('bot', d.reply || d.detail || '…');
    await refreshSession();
  }catch(e){ tip(t('uploadError')); }
}
async function pickLang(lang){await ready;const r=await customerFetch(`/cs/chat/${TOKEN}/lang`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang,visitor})});if(!r.ok)tip(t('networkError'));}
async function sendAction(action){await ready;const r=await customerFetch(`/cs/chat/${TOKEN}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,visitor})});const d=await r.json();bubble('bot',d.reply||d.detail||t('networkError'));await refreshSession();}
// 我的清单抽屉：后端按访客取最近 cs_link token，iframe 复用 list.html 的表格/编辑/导出能力
async function openList(){
  await ready;
  const drawer = document.getElementById('drawer');
  drawer.hidden = false;
  document.getElementById('dempty').hidden = true;
  const frame = document.getElementById('listframe');
  frame.src = 'about:blank';
  try{
    const r = await customerFetch(`/cs/chat/${TOKEN}/list-token?visitor=${encodeURIComponent(visitor)}`);
    const d = await r.json();
    if (d.token){
      frame.src = `${CUSTOMER_PREFIX}/cs/list.html?k=${encodeURIComponent(d.token)}&lang=${CustomerI18n.language}`;
    } else {
      document.getElementById('dempty').hidden = false;
    }
  }catch(e){ tip(t('networkError')); }
}
function closeList(){ document.getElementById('drawer').hidden = true; }
async function newSession(end=false){
  try {
    if(AUTH_TOKEN){
      if(end){const ended=await customerFetch(`/cs/chat/${TOKEN}/session/end`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        if(!ended.ok){tip(t('networkError'));return;}}
      log.replaceChildren();historyBefore=0;document.getElementById('history-more').hidden=true;closeList();await refreshSession();return;
    }
    if(end&&visitor){
      const ended=await customerFetch(`/cs/chat/${TOKEN}/session/end`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor})});
      if(!ended.ok&&![401,410].includes(ended.status)){tip(t('networkError'));return;}
      visitor='';sessionStorage.removeItem(VISITOR_KEY);
    }
    const r=await customerFetch(`/cs/chat/${TOKEN}/session`,{method:'POST'}),d=await r.json();
    if(!r.ok||!d.visitor){tip(t('initError'));return;}
    visitor=d.visitor;sessionStorage.setItem(VISITOR_KEY,visitor);log.replaceChildren();historyBefore=0;document.getElementById('history-more').hidden=true;closeList();await refreshSession();
  }catch(e){tip(t('networkError'));}
}
async function refreshSession(){
  const r=await customerFetch(`/cs/chat/${TOKEN}/session?visitor=${encodeURIComponent(visitor)}`);
  if(r.status===410||r.status===401){tip(t('guestSessionExpired'));return;}
  if(!r.ok)return;const d=await r.json(); photoMode=d.photo_mode;hasPending=!!d.intent_required;
  document.getElementById('pending-photo').hidden=!hasPending;
  document.getElementById('photo-mode').textContent=t('activeMode',{mode:({search:t('findProduct'),notes:t('takeNotes')}[photoMode]||t('choosePhotoIntentAgain'))});
  const el=document.getElementById('batches');el.replaceChildren();
  for(const n of d.notes||[]){if(n.batch_state!=='unassigned'&&n.batch_state!=='legacy_unassigned')continue;
    const label=document.createElement('label'), check=document.createElement('input');check.type='checkbox';check.value=n.id;
    label.append(check,document.createTextNode(t('attachNotes')+n.id+' '+(n.fields['型号或品名']||'')));el.append(label);
  }
  for(const b of d.batches||[]){if(!['pending','confirmed'].includes(b.state))continue;
    const btn=document.createElement('button');btn.textContent=(b.active?t('currentShop'):t('confirmSwitch'))+(b.fields['档口名称']||t('shopPending'));btn.onclick=()=>confirmBatch(b.id);el.append(btn);
    if(b.state==='pending'){const decline=document.createElement('button');decline.textContent=t('declineCard');decline.onclick=()=>confirmBatch(b.id,null,'decline');el.append(decline);}}
}
async function setMode(mode){
  await ready;
  try {
    const r=await customerFetch(`/cs/chat/${TOKEN}/mode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor,mode})});
    const d=await r.json().catch(()=>({}));
    if(d.reply||d.detail)bubble('bot',d.reply||d.detail);
    if(!r.ok)tip(t('pendingPhoto'));
  }catch(e){tip(t('networkError'));}
  finally{await refreshSession();}
}
async function retryPhoto(){if(!photoMode){tip(t('photoIntentPrompt'));return;}await setMode(photoMode);}
async function discardPhoto(){
  await ready;
  try{const r=await customerFetch(`/cs/chat/${TOKEN}/pending-photo/discard`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor})});if(!r.ok)tip(t('networkError'));}
  catch(e){tip(t('networkError'));}
  finally{await refreshSession();}
}
async function confirmBatch(batch_id,fields=null,action='confirm'){
  const note_ids=Array.from(document.querySelectorAll('#batches input:checked'),x=>Number(x.value));
  const r=await customerFetch(`/cs/chat/${TOKEN}/batches/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor,batch_id,note_ids,fields,action})});
  if(!r.ok){tip((await r.json()).detail||t('networkError'));return;}await refreshSession();
}
async function manualBatch(){const name=prompt(t('newShopName'));if(name)await confirmBatch(null,{'档口名称':name});}
CustomerI18n.mount(pickLang);
ready=(async function init(){
  if(AUTH_TOKEN){
    const me=await centralFetch('me',{headers:{'Authorization':'Bearer '+AUTH_TOKEN}}).catch(()=>null);
    if(me?.ok){const data=await me.json();AUTH_EMAIL=data.email;localStorage.setItem('ut_email',AUTH_EMAIL);if(await claimCurrentGuest()){await refreshSession();await loadHistory();}}
    else if(me?.status===401){AUTH_TOKEN='';AUTH_EMAIL='';localStorage.removeItem('ut_token');localStorage.removeItem('ut_email');}
    else tip(t('networkError'));
  }
  renderWho();
  if(!AUTH_TOKEN){if(!visitor)await newSession();else {await refreshSession();await loadHistory();}}

  // 首访先选语言；老访客直接欢迎
  const first = !sessionStorage.getItem('h5lang');
  if (first) { document.getElementById('langbar').hidden = false; }
  else if(!log.children.length)bubble('bot', t('chatReturnWelcome'));
})();
</script>
</body>
</html>
