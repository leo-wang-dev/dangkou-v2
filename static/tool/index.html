<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="photoToolTitle" data-icon="">拍照清单工具</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;background:#f5f6f8;color:#222;display:flex;flex-direction:column;height:var(--customer-viewport-height,100dvh);overflow:hidden}
  header{background:#1677ff;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
  header b{flex:1;font-size:16px}
  header button{border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  #who{font-size:12px;opacity:.9;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #loginbar{background:#fff;border-bottom:1px solid #eee;padding:10px 12px;display:none;flex-direction:column;gap:8px}
  #loginbar .row{display:flex;gap:8px}
  #loginbar input{flex:1;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:15px;outline:none}
  #loginbar button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;background:#1677ff;color:#fff;cursor:pointer}
  #loginbar button:disabled{background:#9ec4ff}
  #loginhint{font-size:12px;color:#888}
  #log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bot{background:#fff;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .me{background:#1677ff;color:#fff;align-self:flex-end}
  nav{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #eee;flex-shrink:0}
  nav button{flex:1;border:0;border-radius:8px;padding:12px 0;font-size:15px;cursor:pointer;background:#1677ff;color:#fff}
  nav button.ghost{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #tip{pointer-events:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9;max-width:80%}
  #drawer{position:fixed;inset:0 0 auto;height:var(--customer-viewport-height,100dvh);z-index:20}
  #drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  #drawer aside{position:absolute;left:0;right:0;top:8%;bottom:0;background:#f5f6f8;border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
  .dhead b{flex:1;font-size:15px}
  .dhead button{border:0;background:#1677ff;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  .dhead button.ghost{background:#fff;color:#1677ff;border:1px solid #1677ff}
  #dlist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .note{background:#fff;border-radius:8px;padding:10px;display:flex;gap:10px;font-size:14px;line-height:1.5}
  .note img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .note .f{flex:1;white-space:pre-wrap;word-break:break-word}
  .note .t{color:#999;font-size:12px;margin-top:4px}
  #dempty{margin:24px 16px;padding:32px 16px;text-align:center;color:#999;background:#fff;border-radius:8px}
  .session-controls,#batches{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;font-size:13px}
  .session-controls button,#batches button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:#245b9c}
  #batches{max-height:160px;overflow:auto;flex-shrink:0}#batches:empty{display:none}#batches label{width:100%}
  body.compact-viewport .session-controls,body.compact-viewport #batches,body.compact-viewport .customer-language{display:none}
</style>
<style>.customer-language{display:flex;gap:10px;align-items:center;padding:8px 16px;background:#fff}.customer-language select{max-width:180px}html[dir=rtl] body{text-align:right}html[dir=rtl] th,html[dir=rtl] td{text-align:start}td[contenteditable],.msg,.f{unicode-bidi:plaintext}html[dir=rtl] .msg.me{align-self:flex-start}html[dir=rtl] .msg.bot{align-self:flex-end}</style></head>
<body>
<header><b data-i18n="photoListFileBase" data-icon="📷 ">📷 拍照清单</b><span id="who"></span><button id="loginbtn" onclick="toggleLogin()" data-i18n="login" data-icon="">登录</button></header>
<div id="loginbar">
  <div class="row"><input id="email" type="email" placeholder="邮箱" data-i18n-placeholder="email" autocomplete="email"><button id="sendbtn" onclick="sendCode()" data-i18n="sendCodeShort" data-icon="">发验证码</button></div>
  <div class="row"><input id="code" type="text" placeholder="6位验证码" data-i18n-placeholder="verificationCode" autocomplete="one-time-code" inputmode="numeric"><button id="verifybtn" onclick="doLogin()" disabled data-i18n="login" data-icon="">登录</button></div>
  <div id="loginhint" data-i18n="loginHint" data-icon="">登录后清单会挂到您的账号；未登录也可直接用（游客模式）。</div>
</div>
<div class="session-controls"><button onclick="newSession(true)" data-i18n="endSession" data-icon="">结束当前会话</button><button onclick="manualBatch()" data-i18n="manualSwitchShop" data-icon="">手动切换档口</button></div><div id="batches"></div><div id="log"></div>
<nav>
  <button onclick="document.getElementById('file').click()" data-i18n="takePhoto" data-icon="📷 ">📷 拍照</button>
  <button class="ghost" onclick="openList()" data-i18n="listShort" data-icon="📋 ">📋 清单</button>
  <button class="ghost" onclick="exportXlsx()" data-i18n="exportExcel" data-icon="⬇ ">⬇ Excel</button>
</nav>
<input id="file" type="file" accept="image/*" capture="environment" hidden onchange="photo(this)">
<div id="tip"></div>
<div id="drawer" hidden>
  <div class="mask" onclick="closeList()"></div>
  <aside>
    <div class="dhead"><b data-i18n="myShortList" data-icon="📋 ">📋 我的清单</b><button class="ghost" onclick="openList()" data-i18n="refresh" data-icon="↻ ">↻ 刷新</button><button onclick="closeList()" data-i18n="close" data-icon="✕ ">✕ 关闭</button></div>
    <div id="dempty" hidden data-i18n="toolListEmpty" data-icon="">还没有条目——拍几张照片，识别后会自动进清单。</div>
    <div id="dlist"></div>
  </aside>
</div>
<script src="customer-catalog.js"></script>
<script src="customer-sources.js"></script>
<script src="customer-i18n.js"></script>
<script>
const {t,label,display,request:customerFetch}=CustomerI18n;

let GUEST = sessionStorage.getItem('ut_guest') || '';
let TOKEN = localStorage.getItem('ut_token') || '';
let EMAIL = localStorage.getItem('ut_email') || '';
const log = document.getElementById('log');
function fitViewport(){
  if(typeof window==='undefined')return;
  const height=window.visualViewport?.height||window.innerHeight;
  if(height>=100)document.documentElement.style.setProperty('--customer-viewport-height',height+'px');
  document.body?.classList?.toggle('compact-viewport',height<400);
}
fitViewport();
if(typeof window!=='undefined'){
  window.visualViewport?.addEventListener('resize',fitViewport);
  window.visualViewport?.addEventListener('scroll',fitViewport);
  window.addEventListener('resize',fitViewport);
}
function bubble(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function tip(t){ const el = document.getElementById('tip'); el.textContent = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 2200); }
function q(){ return TOKEN ? '' : '?guest=' + encodeURIComponent(GUEST); }
function auth(opts){
  opts = opts || {};
  if (TOKEN) opts.headers = Object.assign({'Authorization': 'Bearer ' + TOKEN}, opts.headers || {});
  return opts;
}
function renderWho(){
  const who = document.getElementById('who');
  const btn = document.getElementById('loginbtn');
  if (TOKEN) { who.textContent = EMAIL; btn.textContent = t('logoutShort'); }
  else { who.textContent = t('guestMode'); btn.textContent = t('login'); }
  document.getElementById('loginbar').style.display = 'none';
}
async function toggleLogin(){
  const bar = document.getElementById('loginbar');
  if (TOKEN) {   // 退出登录 → 回游客模式（原游客记录还在）
    const ended = await customerFetch('session/end', auth({method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}));
    if (!ended.ok) { tip(t('networkError')); return; }
    TOKEN = ''; EMAIL = '';
    await newSession();
    localStorage.removeItem('ut_token'); localStorage.removeItem('ut_email');
    renderWho(); bubble('bot', t('signedOutGuest'));
    return;
  }
  bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
}
async function sendCode(){
  const email = document.getElementById('email').value.trim();
  if (!email) { tip(t('enterEmail')); return; }
  document.getElementById('sendbtn').disabled = true;
  try{
    const r = await customerFetch('auth/code', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { tip(d.detail || t('sendError')); return; }
    tip(t('codeSent'));
    document.getElementById('verifybtn').disabled = false;
  }catch(e){ tip(t('networkError')); }
  finally{ document.getElementById('sendbtn').disabled = false; }
}
async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!email || !code) { tip(t('enterEmailCode')); return; }
  document.getElementById('verifybtn').disabled = true;
  try{
    const r = await customerFetch('auth/verify', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, code, guest: TOKEN ? '' : GUEST})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { tip(d.detail || t('loginError')); return; }
    TOKEN = d.token; EMAIL = d.email; GUEST = ''; sessionStorage.removeItem('ut_guest');
    localStorage.setItem('ut_token', TOKEN); localStorage.setItem('ut_email', EMAIL);
    renderWho();
    bubble('bot', t('loginMergedDetailed',{email:EMAIL}));
  }catch(e){ tip(t('networkError')); }
  finally{ document.getElementById('verifybtn').disabled = false; }
}
async function photo(input){
  const f = input.files[0]; input.value = '';
  if (!f) return;
  bubble('me', '📷 ' + (f.name || t('photo')));
  tip(t('recognizing'));
  const fd = new FormData(); fd.append('file', f); fd.append('owner', GUEST);
  try{
    const r = await customerFetch('photo', auth({method: 'POST', body: fd}));
    const d = await r.json().catch(() => ({}));
    bubble('bot', d.reply || d.detail || '…');
    await refreshBatches();
  }catch(e){ tip(t('uploadError')); }
}
async function openList(){
  document.getElementById('drawer').hidden = false;
  const list = document.getElementById('dlist');
  const empty = document.getElementById('dempty');
  list.innerHTML = ''; empty.hidden = true;
  try{
    const r = await customerFetch('notes' + q(), auth({method: 'POST'}));
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { tip(d.detail || t('loadError')); return; }
    const notes = d.notes || [];
    if (!notes.length) { empty.hidden = false; return; }
    notes.forEach((n, i) => {
      const div = document.createElement('div');
      div.className = 'note';
      if (n.photo) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = t('photo');
        img.src = 'notes/' + n.id + '/photo' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '?guest=' + encodeURIComponent(GUEST));
        div.appendChild(img);
      }
      const fields = Object.entries(n.fields || {})
        .filter(([k]) => k !== '__图框__')
        .map(([k, v]) => (n.display_labels?.[k] ?? label(k)) + '=' + (n.display_fields?.[k] ?? display(v))).join('\n');
      const wrap = document.createElement('div');
      wrap.className = 'f';
      wrap.textContent = '【' + (i + 1) + '】\n' + fields;
      const timestamp = document.createElement('div');
      timestamp.className = 't';
      timestamp.textContent = n.created_at || '';
      wrap.appendChild(timestamp);
      div.appendChild(wrap);
      list.appendChild(div);
    });
  }catch(e){ tip(t('networkError')); }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function closeList(){ document.getElementById('drawer').hidden = true; }
async function exportXlsx(){
  try{
    const r = await customerFetch('export.xlsx' + q(), auth());
    if (!r.ok) { const d = await r.json().catch(() => ({})); tip(d.detail || t('exportError')); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = t('photoListFileBase');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }catch(e){ tip(t('networkError')); }
}
async function newSession(end=false){
  if (TOKEN) { tip(t('logout')); return; }
  try {
    if (end && GUEST) {
      const ended = await customerFetch('session/end', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guest:GUEST})});
      if (!ended.ok && ![401,410].includes(ended.status)) { tip(t('networkError')); return; }
      GUEST=''; sessionStorage.removeItem('ut_guest');
    }
    const r=await customerFetch('guest',{method:'POST'}), d=await r.json();
    if(!r.ok || !d.guest){tip(t('initError'));return;}
    GUEST=d.guest; sessionStorage.setItem('ut_guest',GUEST);
    document.getElementById('log').replaceChildren();
    document.getElementById('batches').replaceChildren();
    document.getElementById('dlist').replaceChildren(); closeList();
  } catch(e) { tip(t('networkError')); }
}
async function refreshBatches(){
  const r=await customerFetch('notes'+q(),auth({method:'POST'}));
  if(r.status===410){tip(t('guestSessionExpired'));return;}
  if(!r.ok)return;
  const d=await r.json(); renderBatches(d);
}
function renderBatches(d){
  const el=document.getElementById('batches');el.replaceChildren();
  for(const n of d.notes||[]){if(n.batch_state!=='unassigned'&&n.batch_state!=='legacy_unassigned')continue;
    const label=document.createElement('label'), check=document.createElement('input');check.type='checkbox';check.value=n.id;
    label.append(check,document.createTextNode(t('attachNotes')+n.id+' '+(n.fields['型号或品名']||'')));el.append(label);
  }
  for(const b of d.batches||[]){if(!['pending','confirmed'].includes(b.state))continue;
    const btn=document.createElement('button');btn.textContent=(b.active?t('currentShop'):t('confirmSwitch'))+(b.fields['档口名称']||t('shopPending'));
    btn.onclick=()=>confirmBatch(b.id);el.append(btn);
    if(b.state==='pending'){const decline=document.createElement('button');decline.textContent=t('declineCard');decline.onclick=()=>confirmBatch(b.id,null,'decline');el.append(decline);}
  }
}
async function confirmBatch(batch_id,fields=null,action='confirm'){
  const note_ids=Array.from(document.querySelectorAll('#batches input:checked'),x=>Number(x.value));
  const r=await customerFetch((fields?'batches':'batches/confirm')+q(),auth({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id,note_ids,fields,action})}));
  if(!r.ok){tip((await r.json()).detail||t('networkError'));return;} await refreshBatches();
}
async function manualBatch(){const name=prompt(t('newShopName'));if(name)await confirmBatch(null,{'档口名称':name});}
CustomerI18n.mount(async lang=>{await customerFetch('lang',auth({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang,guest:GUEST})}))});
(async function init(){
  if(TOKEN){const r=await customerFetch('me',auth());if(r.ok){const d=await r.json();if(d.lang)CustomerI18n.setLanguage(d.lang)}}
  renderWho();
  if (!GUEST) {
    try{
      const r = await customerFetch('guest', {method: 'POST'});
      const d = await r.json();
      GUEST = d.guest;
      sessionStorage.setItem('ut_guest', GUEST);
    }catch(e){ tip(t('initError')); }
  }
  await refreshBatches();
  bubble('bot', t('toolWelcome'));
})();
</script>
</body>
</html>
