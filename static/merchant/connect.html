<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>绑定商家客服</title><style>body{max-width:620px;margin:50px auto;padding:20px;font:17px system-ui}input,button{padding:12px;margin:12px 0;width:100%;box-sizing:border-box}#status{white-space:pre-wrap}button{cursor:pointer}</style><h1>绑定你的客服 bot</h1><p>在 Telegram 打开 @BotFather，发送 /newbot，按提示设置名称和以 bot 结尾的用户名。把它给你的 Token 填到这里。</p><p>请使用专门用于本店接待的 bot，关闭其他程序的轮询。不要填写平台接入助手的 Token。</p><form id="form"><label for="token">Bot Token</label><input id="token" type="password" autocomplete="off" required maxlength="130"><button id="submit">验证 bot 身份</button></form><p id="status" role="status"></p><script src="/merchant/connect.js"></script></html>
