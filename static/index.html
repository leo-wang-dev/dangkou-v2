<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档口商品管理</title>
<style>
:root{--blue:#1652f0;--red:#e5484d;--bg:#f5f6f8;--line:#ececec}
*{box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;margin:0;background:var(--bg);color:#222}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;position:sticky;top:0;z-index:9}
header button{border:0;background:none;font-size:16px;padding:8px 14px;border-radius:10px;cursor:pointer}
header button.on{background:var(--blue);color:#fff}
main{padding:16px;max-width:1180px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:#222;color:#fff;border-color:#222}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn{border:0;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn.p{background:var(--blue);color:#fff}.btn.d{background:var(--red);color:#fff}
.btn.o{background:#fff;border:1px solid #ddd;color:#333}
.btn.s{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:#999;font-size:13px}
input,textarea,select{padding:9px;border:1px solid #ddd;border-radius:9px;font-size:14px;width:100%}
/* 审核明细行 */
.draft{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start}
.draft.rej{opacity:.45;background:#fff7f7}
.draft.dup{border-color:#f0a030;background:#fffbf0}
.draft.done{opacity:.5}
.draft.done .btn{pointer-events:none}
.draft .f{flex:1;min-width:0}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;margin-right:6px}
.tag.new{background:#e8f5e9;color:#1b7e34}.tag.upd{background:#e8f0fe;color:var(--blue)}
.tag.del{background:#fdecea;color:var(--red)}
.kv{font-size:13px;color:#555;margin-top:3px}
/* 图片 */
img.p{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:#f0f0f0;flex:none}
.badge{position:absolute;right:-6px;bottom:-6px;background:rgba(0,0,0,.65);color:#fff;
  font-size:11px;border-radius:8px;padding:1px 6px}
.imgwrap{position:relative;flex:none}
/* 商品卡片 */
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px}
.pcard{padding:14px}
.phead{display:flex;gap:12px;align-items:flex-start}
img.big{width:86px;height:86px}
.noimg{width:86px;height:86px;border-radius:10px;background:#f3f3f3;color:#bbb;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.pinfo{flex:1;min-width:0}
.ptitle{font-weight:600;font-size:15px;word-break:break-all;line-height:1.4}
.psub{margin-top:2px}
.pbtns{display:flex;gap:6px;margin-top:10px}
.pfields{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.pf{display:flex;gap:8px;font-size:13px;padding:4px 0;align-items:baseline}
.pl{color:#999;flex:none;width:112px}
.pv{color:#333;word-break:break-all;white-space:pre-wrap}
/* 灯箱 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh}
#lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;
  background:rgba(0,0,0,.4);border:0;border-radius:50%;width:46px;height:46px;cursor:pointer}
#lbPrev{left:12px}#lbNext{right:12px}
/* 表单弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal .box{background:#fff;border-radius:16px;padding:20px;max-width:580px;width:100%;max-height:88vh;overflow:auto}
#modal .box h3{margin:0 0 14px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#666;margin-bottom:4px}
/* 图片管理区（编辑框内） */
.imgman{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgman .cell{position:relative;width:72px;height:72px}
.imgman .cell img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.imgman .cell button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  border:0;background:var(--red);color:#fff;font-size:13px;cursor:pointer;line-height:1}
.imgman .add{width:72px;height:72px;border:1.5px dashed #bbb;border-radius:8px;background:none;
  font-size:22px;color:#999;cursor:pointer}
.empty{text-align:center;color:#aaa;padding:40px 0}
</style>
</head>
<body>
<header>
  <button id="v-review" class="on" onclick="show('review')">审核</button>
  <button id="v-products" onclick="show('products')">商品</button>
</header>
<main>
  <div id="review"></div>
  <div id="products" style="display:none">
    <div class="tabs" id="catTabs"></div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn p" onclick="openForm()">＋ 新增商品</button>
      <input id="q" placeholder="搜索型号 / 内部货号 / 字段…" oninput="renderProducts()" style="max-width:320px">
    </div>
    <div id="plist"></div>
  </div>
</main>
<div id="lightbox" onclick="if(event.target===this)this.style.display='none'">
  <button class="nav" id="lbPrev" onclick="event.stopPropagation();lbStep(-1)">‹</button>
  <img id="lbimg" onclick="event.stopPropagation()">
  <button class="nav" id="lbNext" onclick="event.stopPropagation();lbStep(1)">›</button>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const H = {'X-Service-Token': TOKEN, 'Content-Type': 'application/json'};
const CAT_NAMES = {razor:'剃须刀', curler:'卷发棒'};
let cur = {cat:'razor', tpl:null, prods:[], detailCat:null};
const rej = new Set();
const edits = {};
let draftRows = {};

const str = v => v===null||v===undefined?'':String(v);
const esc = s => str(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const api = async (p, opt={}) => {
  const r = await fetch(p, {...opt, headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
};
function show(v){
  document.querySelectorAll('header button').forEach(b=>b.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.getElementById('review').style.display = v==='review'?'':'none';
  document.getElementById('products').style.display = v==='products'?'':'none';
  if(v==='review') loadTickets();
  if(v==='products') loadCats();
}

/* ---------- 灯箱 ---------- */
let lbList = [], lbIdx = 0;
function lbGallery(urls){ lbList=urls; lbIdx=0; showLb(); }
function lbStep(d){ if(!lbList.length) return; lbIdx=(lbIdx+d+lbList.length)%lbList.length; showLb(); }
function showLb(){ document.getElementById('lbimg').src=lbList[lbIdx]; document.getElementById('lightbox').style.display='flex'; }

/* ---------- 审核页 ---------- */
async function loadTickets(){
  const el = document.getElementById('review');
  const d = await api('/tickets');
  const pend = d.tickets.filter(t=>t.status==='pending');
  if(!pend.length){ el.innerHTML = '<div class="card empty">没有待办工单 🎉</div>'; return; }
  el.innerHTML = '';
  for(const t of pend){
    const c = document.createElement('div'); c.className='card';
    c.innerHTML = `<div class="row" style="justify-content:space-between">
      <div><b>#${t.id}</b> ${t.ticket_type==='import'?'整批导入':'AI 操作'}
        <span class="muted">· ${CAT_NAMES[t.category]||t.category} · ${t.created_at}</span></div>
      <button class="btn o" onclick="loadDetail(${t.id})">展开明细 ▾</button></div>
      <div class="row" style="margin-top:10px">
        <button class="btn p" onclick="submitDecision(${t.id},false)">整单通过</button>
        <button class="btn d" onclick="submitDecision(${t.id},true)">整单驳回</button>
        <span class="muted">可展开明细逐行编辑（含图片）/驳回</span>
      </div><div id="detail-${t.id}" style="margin-top:12px"></div>`;
    el.appendChild(c);
  }
}
const _tplCache = {};
async function tplFields(cat){
  if(_tplCache[cat]) return _tplCache[cat];
  const d = await api('/products/'+cat);
  _tplCache[cat] = d.template.fields;
  return d.template.fields;
}
async function loadDetail(tid){
  const box = document.getElementById('detail-'+tid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const d = await api('/tickets/'+tid);
  cur.detailCat = d.ticket.category;
  const p = d.payload, drafts = p.drafts||{};
  const fields = await tplFields(cur.detailCat);
  let html = '';
  const rowHtml = (tag, imgs, kv, key, done) => `
    <div class="draft ${done?'done':''}" id="row-${tid}-${key}">
      ${imgs.length?`<div class="imgwrap"><img class="p" src="${imgs[0]}" onclick="lbGallery(${JSON.stringify(imgs).replace(/"/g,'&quot;')})">
        ${imgs.length>1?`<span class="badge">${imgs.length}图</span>`:''}</div>`:''}
      <div class="f"><span class="tag ${tag.cls}">${tag.txt}</span>
        ${fields.map(f=>kv[f.col]?`<div class="kv"><b>${f.label}</b>：${esc(str(kv[f.col]))}</div>`:'').join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex:none">
        <button class="btn p s" onclick="rowApprove(${tid},'${key}')">✓通过</button>
        <button class="btn o s" onclick="editDraft('${key}')">编辑</button>
        <button class="btn d s" onclick="toggleRej(${tid},'${key}',this)">驳回</button>
      </div>
    </div>`;
  draftRows = {};
  const doneRows = (p.done_rows || {});
  const modelCount = {};
  (drafts.new||[]).forEach(d2=>{ const m=str(d2.model_no||d2.item_no); modelCount[m]=(modelCount[m]||0)+1; });
  (drafts.new||[]).forEach((d2,i)=>{
    const key = d2._rid||('n'+i);
    draftRows[key] = d2;
    const m = str(d2.model_no||d2.item_no);
    const dup = modelCount[m] > 1 ? ' ⚠️重复' : '';
    const done = doneRows[key];
    const cls = done === 'approved' ? 'ok' : (done === 'rejected' ? 'del' : 'new');
    const label = done === 'approved' ? '已✓' : (done === 'rejected' ? '已驳回' : '新增'+dup);
    html += rowHtml({txt:label,cls:cls}, d2._imgs||[], d2, key, done); });
  (drafts.update||[]).forEach((pair,i)=>{
    const [row,d2] = Array.isArray(pair)?pair:[pair,pair];
    const key = row.id||('u'+i);
    draftRows[key] = {...d2, _imgs:d2._imgs||['/img/'+row.image_main+'?token='+TOKEN].filter(u=>!u.includes('null'))};
    const imgs = draftRows[key]._imgs;
    html += rowHtml({txt:'更新',cls:'upd'}, imgs, d2, key); });
  (drafts.delist||[]).forEach((r,i)=>{
    const key = (r&&r.id)||('d'+i);
    const imgs = (r&&r.image_main)?['/img/'+r.image_main+'?token='+TOKEN]:[];
    html += rowHtml({txt:'下架',cls:'del'}, imgs, r||{}, key); });
  if(d.ticket.ticket_type==='mutate'){
    html = `<div class="card"><b>AI 操作</b><pre style="white-space:pre-wrap;font-size:13px">${esc(JSON.stringify(p,null,1))}</pre></div>`+html;
  }
  box.innerHTML = html || '<div class="muted">（无明细行）</div>';
}
async function rowApprove(tid, key){
  if(!confirm('确认通过此行？将立即落库。')) return;
  const t = (await api('/tickets')).tickets.find(x=>x.id===tid);
  try{
    await api(`/tickets/${tid}/row`, {method:'POST', body:JSON.stringify(
      {token:t.token, row_key:key, approved:true})});
    loadDetail(tid); loadDetail(tid); // 刷新
  }catch(e){ alert('单行通过失败：'+e.message); }
}
function toggleRej(tid, key, btn){
  const el = document.getElementById(`row-${tid}-${key}`);
  if(rej.has(`${tid}:${key}`)){ rej.delete(`${tid}:${key}`); el.classList.remove('rej'); btn.textContent='驳回'; }
  else{ rej.add(`${tid}:${key}`); el.classList.add('rej'); btn.textContent='已驳回↩'; }
}
async function submitDecision(tid, wholeReject){
  const reject = [...rej].filter(k=>k.startsWith(tid+':')).map(k=>k.split(':')[1]);
  const rowEdits = edits[tid] || {};
  if(wholeReject && !confirm('确认整单驳回？（全部行不生效，含已做的编辑）')) return;
  if(!wholeReject && !confirm(`通过本单：${reject.length} 行驳回、${Object.keys(rowEdits).length} 行带修改，确认？`)) return;
  const t = (await api('/tickets')).tickets.find(x=>x.id===tid);
  try{
    const r = await api(`/tickets/${tid}/decision`, {method:'POST', body:JSON.stringify(
      {token:t.token, approved:!wholeReject, decisions:{reject, edits: rowEdits}})});
    alert(wholeReject?'已整单驳回':`已通过：新增${r.created||0} / 更新${r.updated||0} / 下架${r.delisted||0}`);
    [...rej].filter(k=>k.startsWith(tid+':')).forEach(k=>rej.delete(k));
    delete edits[tid];
    loadTickets();
  }catch(e){ alert('决策失败：'+e.message); }
}

/* ---------- 编辑弹窗（字段 + 图片管理合一） ---------- */
let formCtx = null;   // {mode:'draft'|'product'|'create', tid?, key?, pid?, images:[{rel,url}]}
function imgManHtml(){
  const cells = (formCtx.images||[]).map((im,i)=>`
    <div class="cell"><img src="${im.url}" onclick="lbGallery(['${im.url}'])">
      <button type="button" onclick="delImg(${i})">×</button></div>`).join('');
  return `<div class="imgman">${cells}<button type="button" class="add" onclick="document.getElementById('formFile').click()">＋</button></div>
  <input type="file" id="formFile" accept="image/*" multiple style="display:none" onchange="addImgs(this)">`;
}
function delImg(i){ formCtx.images.splice(i,1); renderImgMan(); }
async function addImgs(input){
  const files=[...input.files]; input.value='';
  for(const f of files){
    const fd=new FormData(); fd.append('file',f);
    const r=await fetch('/upload',{method:'POST',headers:{'X-Service-Token':TOKEN},body:fd});
    if(!r.ok){ alert('上传失败:'+await r.text()); return; }
    const rel=(await r.json()).path;
    formCtx.images.push({rel, url:`/img/${rel}?token=${TOKEN}`});
  }
  renderImgMan();
}
function renderImgMan(){
  const el=document.getElementById('imgManArea');
  if(el) el.innerHTML=imgManHtml();
}
function formHtml(title, kv, fields){
  return `<h3>${title}</h3>` +
    fields.map(f=>`<div class="fg"><label>${f.label}</label>
      <input id="fg-${f.col}" value="${esc(str(kv[f.col]))}"></div>`).join('') +
    `<div class="fg"><label>图片（点 × 删除，点 ＋ 上传新图）</label><div id="imgManArea">${imgManHtml()}</div></div>` +
    `<div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn o" onclick="closeForm()">取消</button>
      <button class="btn p" onclick="submitForm()">提交</button></div>
    <p class="muted" style="margin:10px 0 0">提交后生成审批工单，审核页通过才生效。</p>`;
}
function closeForm(){ document.getElementById('modal').style.display='none'; formCtx=null; }

async function editDraft(key){
  const cat = cur.detailCat || cur.cat;
  const fields = await tplFields(cat);
  const d = draftRows[key] || {};
  const srcImgs = d._imgs||[];
  const srcRels = d.images||(d.image_main?[d.image_main]:[]);
  formCtx = {mode:'draft', tid:_curTid, key, cat,
    images: srcImgs.map((u,i)=>({rel:srcRels[i]||null, url:u}))};
  document.getElementById('modalBox').innerHTML =
    formHtml('编辑草稿（审核修正）', d, fields);
  document.getElementById('modal').style.display='flex';
}
let _curTid = null;
const _origLoadDetail = loadDetail;
loadDetail = async function(tid){ _curTid = tid; return _origLoadDetail(tid); };

async function openForm(pid){
  const fields = await tplFields(cur.cat);
  const p = pid ? cur.prods.find(x=>x['id']===pid) : null;
  formCtx = {mode: p?'product':'create', pid,
    images: (p?(p['图集']||[p['主图']].filter(Boolean)):[]).map(rel=>({rel, url:`/img/${rel}?token=${TOKEN}`}))};
  document.getElementById('modalBox').innerHTML =
    formHtml(`${p?'编辑':'新增'}商品（${CAT_NAMES[cur.cat]}）`, p||{}, fields);
  document.getElementById('modal').style.display='flex';
}
async function submitForm(){
  const fields = await tplFields(formCtx.mode==='draft'?formCtx.cat:cur.cat);
  const changes = {};
  for(const f of fields){
    const el=document.getElementById('fg-'+f.col);
    if(el){ const v=el.value.trim(); if(v) changes[f.col]=v; }
  }
  try{
    if(formCtx.mode==='draft'){
      const {tid,key}=formCtx;
      (edits[tid]=edits[tid]||{})[key]={};
      if(Object.keys(changes).length) Object.assign(edits[tid][key],changes);
      const rels=formCtx.images.map(x=>x.rel).filter(Boolean);
      if(rels.length) edits[tid][key]['__images']=rels;
      if(!Object.keys(edits[tid][key]).length) delete edits[tid][key];
      closeForm();
      const box=document.getElementById('detail-'+tid);
      if(box){ box.innerHTML=''; loadDetail(tid); }
      const badge=document.querySelector(`#row-${tid}-${key} .tag`);
      if(badge&&!badge.textContent.includes('✎')) badge.textContent+=' ✎';
    }else if(formCtx.mode==='product'){
      const body={changes, images:formCtx.images.map(x=>x.rel).filter(Boolean)};
      const r = await api(`/products/${cur.cat}/${formCtx.pid}`, {method:'PATCH', body:JSON.stringify(body)});
      closeForm(); alert('修改工单 #'+r.ticket_id+' 已生成，请到审核页批准'); show('review');
    }else{
      const r = await api(`/products/${cur.cat}`, {method:'POST', body:JSON.stringify({changes})});
      closeForm(); alert('新增工单 #'+r.ticket_id+' 已生成，请到审核页批准'); show('review');
    }
  }catch(e){ alert('提交失败：'+e.message); }
}

/* ---------- 商品页 ---------- */
async function loadCats(){
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = '';
  for(const [key,name] of Object.entries(CAT_NAMES)){
    const b = document.createElement('button');
    b.textContent = name; b.className = key===cur.cat?'on':'';
    b.onclick = ()=>{cur.cat=key; delete _tplCache[key]; loadCats()};
    tabs.appendChild(b);
  }
  const d = await api('/products/'+cur.cat);
  cur.tpl = d.template; cur.prods = d.products;
  renderProducts();
}
function renderProducts(){
  const q = document.getElementById('q').value.toLowerCase();
  const rows = cur.prods.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
  const el = document.getElementById('plist');
  if(!rows.length){ el.innerHTML = '<div class="card empty" style="grid-column:1/-1">暂无商品</div>'; return; }
  const first = cur.tpl.fields[0];
  el.innerHTML = rows.map(p=>{
    const imgs=(p['图集']&&p['图集'].length?p['图集']:[p['主图']].filter(Boolean))
      .map(r=>`/img/${r}?token=${TOKEN}`);
    return `<div class="card pcard">
      <div class="phead">
        ${imgs.length?`<div class="imgwrap"><img class="p big" src="${imgs[0]}" onclick='lbGallery(${JSON.stringify(imgs)})'>
          ${imgs.length>1?`<span class="badge">${imgs.length}图</span>`:''}</div>`
          :'<div class="noimg">无图</div>'}
        <div class="pinfo">
          <div class="ptitle">${esc(str(p[first.label]))||'（无型号）'}</div>
          <div class="psub muted">${p['内部货号']??''} · ${p['状态']??''}</div>
          <div class="pbtns">
            <button class="btn o s" onclick="openForm('${p['id']}')">编辑</button>
            <button class="btn d s" onclick="delP('${p['id']}')">下架</button>
          </div>
        </div>
      </div>
      <div class="pfields">
        ${cur.tpl.fields.slice(1).map(f=>`
          <div class="pf"><span class="pl">${f.label}</span><span class="pv">${esc(str(p[f.label]))||'—'}</span></div>`).join('')}
      </div>
    </div>`;}).join('');
}
async function delP(pid){
  if(!confirm('确认下架？（生成审批工单，批准后生效）')) return;
  const r = await api(`/products/${cur.cat}/${pid}`, {method:'DELETE'});
  alert('下架工单 #'+r.ticket_id+' 已生成，请到审核页批准');
  show('review');
}
show('review');
</script>
</body>
</html>
